name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the scheduling engine
        run: ./gradlew -p core test

      - name: Build the APK
        run: ./gradlew :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk initiative-${{ github.run_number }}.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: initiative-${{ github.run_number }}
          path: initiative-${{ github.run_number }}.apk
          retention-days: 30

      # Builds of the main branch also become a release, which is the easy
      # place to download from on the phone. See docs/BUILDING.md.
      - name: Publish a release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Initiative build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "Built from ${{ github.sha }}. Download the .apk below on your phone and install it."
          files: initiative-${{ github.run_number }}.apk
