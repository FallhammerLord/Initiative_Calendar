# One-off diagnostic, run by hand: which kinds of release may this repo's
# Actions token create? Cleans up after itself and never fails.
name: Release probe

on: workflow_dispatch

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try each kind of release
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          try() {
            echo "== $1"
            shift
            gh api -X POST "repos/$R/releases" -f target_commitish="$SHA" "$@" --jq '"created id \(.id) prerelease=\(.prerelease) draft=\(.draft)"' 2>&1 | head -3
          }
          try "full release"   -f tag_name=probe-full   -f name=probe-full
          try "pre-release"    -f tag_name=probe-pre    -f name=probe-pre -F prerelease=true
          try "draft"          -f tag_name=probe-draft  -f name=probe-draft -F draft=true
          try "not latest"     -f tag_name=probe-nolat  -f name=probe-nolat -f make_latest=false
          echo "== cleanup"
          for t in probe-full probe-pre probe-draft probe-nolat; do
            gh release delete "$t" --repo "$R" --cleanup-tag --yes 2>&1 | head -1
          done
          for id in $(gh api "repos/$R/releases" --jq '.[] | select(.draft and (.name|startswith("probe-"))) | .id'); do
            gh api -X DELETE "repos/$R/releases/$id"
          done
          exit 0
